server {
    listen 3000;
    server_name _;
    client_max_body_size 200m;
    root /usr/share/nginx/html;

    # Resolve Docker service names at request time (not at nginx startup).
    # Without this, nginx exits if "backend" is not yet registered in DNS.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # SPA routing — all non-asset paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy REST API to FastAPI backend
    location /api/ {
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Proxy WebSocket connections (RAG chat)
    location /ws/ {
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Keep WS alive for the full chat session (24 h)
        proxy_read_timeout 86400s;
    }
}
